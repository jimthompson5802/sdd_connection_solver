openapi: 3.0.3
info:
  title: NYT Connections Puzzle Assistant API
  description: Backend API for the NYT Connections puzzle solving web application
  version: 1.0.0
  contact:
    name: API Support
    email: support@example.com

servers:
  - url: http://localhost:8000
    description: Local development server

paths:
  /api/v1/puzzles/upload:
    post:
      summary: Upload a text file with 16 words to create a puzzle
      operationId: uploadPuzzle
      tags: [Puzzles]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Text file containing 16 comma-separated words
                user_id:
                  type: string
                  description: Optional user identifier
      responses:
        '201':
          description: Puzzle created successfully from uploaded file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PuzzleResponse'
        '400':
          description: Invalid file format or word count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/puzzles/{puzzle_id}:
    get:
      summary: Get puzzle details
      operationId: getPuzzle
      tags: [Puzzles]
      parameters:
        - name: puzzle_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Puzzle details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PuzzleResponse'
        '404':
          description: Puzzle not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/sessions:
    post:
      summary: Create a new game session
      operationId: createSession
      tags: [Sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '201':
          description: Session created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          description: Invalid session data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/sessions/{session_id}:
    get:
      summary: Get current session state
      operationId: getSession
      tags: [Sessions]
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Session state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/sessions/{session_id}/recommendations:
    post:
      summary: Generate next AI recommendation for current puzzle state
      operationId: generateRecommendation
      tags: [AI Recommendations]
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: New recommendation generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationResponse'
        '400':
          description: Invalid session state for recommendations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Pending recommendation already exists, must evaluate first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      summary: Get current pending recommendation
      operationId: getCurrentRecommendation
      tags: [AI Recommendations]
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Current recommendation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationResponse'
        '404':
          description: No pending recommendation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/sessions/{session_id}/recommendations/{recommendation_id}/evaluate:
    post:
      summary: Evaluate an AI recommendation as correct, incorrect, or one-away
      operationId: evaluateRecommendation
      tags: [AI Recommendations]
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: recommendation_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluateRecommendationRequest'
      responses:
        '200':
          description: Recommendation evaluated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationResponse'
        '400':
          description: Invalid evaluation data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Recommendation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/sessions/{session_id}/history:
    get:
      summary: Get complete recommendation history for session
      operationId: getRecommendationHistory
      tags: [History]
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Recommendation history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationHistoryResponse'

  /ws/sessions/{session_id}/recommendations:
    get:
      summary: WebSocket connection for real-time AI recommendations
      tags: [WebSocket]
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '101':
          description: WebSocket connection established
        '400':
          description: Invalid session
        '404':
          description: Session not found

components:
  schemas:
    PuzzleResponse:
      type: object
      required: [id, words, uploaded_filename, created_at]
      properties:
        id:
          type: string
          format: uuid
        words:
          type: array
          items:
            type: string
          minItems: 16
          maxItems: 16
        uploaded_filename:
          type: string
          description: Original filename of uploaded text file
        created_at:
          type: string
          format: date-time
        user_id:
          type: string
          nullable: true

    CreateSessionRequest:
      type: object
      required: [puzzle_id, llm_model]
      properties:
        puzzle_id:
          type: string
          format: uuid
        llm_model:
          type: string
          enum: [gpt-4, gpt-3.5-turbo, claude-3-sonnet, claude-3-haiku]
          description: LLM model to use for recommendations
        user_id:
          type: string
          nullable: true

    SessionResponse:
      type: object
      required: [id, puzzle_id, start_time, last_activity, status, remaining_words, incorrect_evaluation_count, solved_groups_count, can_request_recommendation, llm_model_config]
      properties:
        id:
          type: string
          format: uuid
        puzzle_id:
          type: string
          format: uuid
        start_time:
          type: string
          format: date-time
        last_activity:
          type: string
          format: date-time
        status:
          type: string
          enum: [active, completed, failed, abandoned]
        remaining_words:
          type: array
          items:
            type: string
        incorrect_evaluation_count:
          type: integer
          minimum: 0
          maximum: 4
        solved_groups_count:
          type: integer
          minimum: 0
          maximum: 4
        solved_groups:
          type: array
          items:
            $ref: '#/components/schemas/SolvedGroup'
        can_request_recommendation:
          type: boolean
          description: Whether user can request next recommendation
        pending_recommendation_id:
          type: string
          format: uuid
          nullable: true
          description: ID of current unevaluated recommendation
        llm_model_config:
          type: string
          description: Configured LLM model for this session

    SolvedGroup:
      type: object
      required: [theme, difficulty, words]
      properties:
        theme:
          type: string
        difficulty:
          type: string
          enum: [yellow, green, blue, purple]
        words:
          type: array
          items:
            type: string
          minItems: 4
          maxItems: 4

    RecommendationResponse:
      type: object
      required: [id, recommended_words, explanation, timestamp, llm_model, processing_time_ms]
      properties:
        id:
          type: string
          format: uuid
        recommended_words:
          type: array
          items:
            type: string
          minItems: 4
          maxItems: 4
        explanation:
          type: string
          minLength: 10
          maxLength: 500
        timestamp:
          type: string
          format: date-time
        user_evaluation:
          type: string
          enum: [correct, incorrect, one_away]
          nullable: true
          description: User's evaluation (null if pending)
        evaluation_timestamp:
          type: string
          format: date-time
          nullable: true
        llm_model:
          type: string
        processing_time_ms:
          type: integer
          minimum: 1

    EvaluateRecommendationRequest:
      type: object
      required: [evaluation]
      properties:
        evaluation:
          type: string
          enum: [correct, incorrect, one_away]
          description: User's evaluation of the recommendation

    EvaluationResponse:
      type: object
      required: [recommendation, session_status, next_action]
      properties:
        recommendation:
          $ref: '#/components/schemas/RecommendationResponse'
        session_status:
          type: string
          enum: [active, completed, failed]
          description: Updated session status after evaluation
        next_action:
          type: string
          enum: [request_next_recommendation, view_history, game_complete]
          description: Suggested next action for user
        solved_group:
          $ref: '#/components/schemas/SolvedGroup'
          nullable: true
          description: Group details if evaluation was correct

    RecommendationHistoryResponse:
      type: object
      required: [recommendations, session_summary]
      properties:
        recommendations:
          type: array
          items:
            $ref: '#/components/schemas/RecommendationResponse'
          description: All recommendations in chronological order
        session_summary:
          type: object
          required: [total_recommendations, correct_evaluations, incorrect_evaluations, one_away_evaluations]
          properties:
            total_recommendations:
              type: integer
            correct_evaluations:
              type: integer
            incorrect_evaluations:
              type: integer
            one_away_evaluations:
              type: integer
            session_duration_minutes:
              type: number
              format: float

    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          example: "VALIDATION_ERROR"
        message:
          type: string
          example: "Invalid request data"
        details:
          type: object
          nullable: true
          description: Additional error context

tags:
  - name: Puzzles
    description: Puzzle upload and management operations
  - name: Sessions
    description: Game session management
  - name: AI Recommendations
    description: LLM-powered word grouping suggestions and evaluations
  - name: History
    description: Recommendation history and session tracking

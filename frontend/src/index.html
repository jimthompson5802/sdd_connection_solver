<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NYT Connections Puzzle Assistant</title>
    <meta name="description" content="AI-powered assistant for solving NYT Connections puzzles">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🧩%3C/text%3E%3C/svg%3E">
</head>
<body>
    <div id="app">
        <!-- Navigation Header -->
        <header class="app-header">
            <div class="header-content">
                <h1 class="app-title">
                    <span class="title-icon">🧩</span>
                    NYT Connections Puzzle Assistant
                </h1>
                <div class="header-actions">
                    <!-- Future: Navigation buttons will be added here -->
                </div>
            </div>
        </header>

        <!-- Main Application Content -->
        <main class="app-main">
            <!-- Content will be dynamically updated by TypeScript -->
            <div class="loading-state">
                <p>Loading application...</p>
            </div>
        </main>

        <!-- Footer -->
        <footer class="app-footer">
            <div class="footer-content">
                <p class="footer-text">
                    NYT Connections Puzzle Assistant v1.0.0 - 
                    <span class="footer-link">Powered by AI</span>
                </p>
            </div>
        </footer>

        <!-- Toast/Notification Container -->
        <div id="notifications" class="notifications-container">
            <!-- Dynamic notifications will appear here -->
        </div>
    </div>

    <!-- Application Scripts -->
    <script type="module" src="main.js"></script>
</body>
</html>
